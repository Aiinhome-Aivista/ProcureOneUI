<svg width="700" height="500" viewBox="0 0 700 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Background -->
  <rect width="700" height="500" fill="white" rx="16"/>
  
  <!-- Header Bar -->
  <rect x="20" y="20" width="660" height="60" fill="#F9FAFB" rx="10"/>
  <text x="35" y="48" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#111827">Dashboard</text>
  <text x="35" y="65" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Overview of your procurement activities</text>
  
  <!-- Filter Icons -->
  <circle cx="620" cy="45" r="18" fill="#E5E7EB"/>
  <rect x="614" y="41" width="12" height="2" fill="#6B7280" rx="1"/>
  <rect x="614" y="45" width="12" height="2" fill="#6B7280" rx="1"/>
  <rect x="614" y="49" width="12" height="2" fill="#6B7280" rx="1"/>
  
  <circle cx="655" cy="45" r="18" fill="#E5E7EB"/>
  <circle cx="655" cy="41" r="1.5" fill="#6B7280"/>
  <circle cx="655" cy="45" r="1.5" fill="#6B7280"/>
  <circle cx="655" cy="49" r="1.5" fill="#6B7280"/>
  
  <!-- Stats Cards Row -->
  <g transform="translate(20, 100)">
    <!-- Card 1 - Total Spent -->
    <rect width="200" height="100" fill="#F5F3FB" rx="10"/>
    <text x="15" y="25" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Total Spent</text>
    <text x="15" y="52" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#111827">$15,900</text>
    <text x="15" y="75" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#10B981">↑ +12.5%</text>
    
    <!-- Card 2 - Active POs -->
    <rect x="220" width="200" height="100" fill="#EFF6FF" rx="10"/>
    <text x="235" y="25" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Active POs</text>
    <text x="235" y="52" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#111827">25</text>
    <text x="235" y="75" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#10B981">↑ +8.2%</text>
    
    <!-- Card 3 - Avg Time -->
    <rect x="440" width="220" height="100" fill="#F0FDF4" rx="10"/>
    <text x="455" y="25" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Average Time</text>
    <text x="455" y="52" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#111827">2.5 Days</text>
    <text x="455" y="75" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#EF4444">↓ -5.3%</text>
  </g>
  
  <!-- Chart Section -->
  <rect x="20" y="220" width="320" height="240" fill="#F9FAFB" rx="10"/>
  <text x="35" y="245" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#111827">Spending Overview</text>
  
  <!-- Bar Chart -->
  <g transform="translate(35, 260)">
    <!-- Grid lines -->
    <line x1="0" y1="0" x2="290" y2="0" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="0" y1="40" x2="290" y2="40" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="0" y1="80" x2="290" y2="80" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="0" y1="120" x2="290" y2="120" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="0" y1="160" x2="290" y2="160" stroke="#E5E7EB" stroke-width="1"/>
    
    <!-- Bars -->
    <rect x="10" y="70" width="30" height="90" fill="#4319C2" rx="4"/>
    <rect x="55" y="50" width="30" height="110" fill="#6847CE" rx="4"/>
    <rect x="100" y="60" width="30" height="100" fill="#8E75DA" rx="4"/>
    <rect x="145" y="25" width="30" height="135" fill="#4319C2" rx="4"/>
    <rect x="190" y="45" width="30" height="115" fill="#6847CE" rx="4"/>
    <rect x="235" y="55" width="30" height="105" fill="#8E75DA" rx="4"/>
  </g>
  
  <!-- Recent Activities Section -->
  <rect x="360" y="220" width="320" height="240" fill="#F9FAFB" rx="10"/>
  <text x="375" y="245" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#111827">Recent Activity</text>
  
  <!-- Activity Items -->
  <g transform="translate(375, 260)">
    <!-- Item 1 -->
    <circle cx="18" cy="18" r="16" fill="#EDE9FE"/>
    <path d="M18 12 L18 18 L22 18" stroke="#4319C2" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="45" y="17" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#111827">PO-2025-0012</text>
    <text x="45" y="28" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6B7280">Requisition Pending</text>
    <text x="240" y="22" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#111827">$2,850</text>
    
    <!-- Item 2 -->
    <circle cx="18" cy="68" r="16" fill="#DBEAFE"/>
    <rect x="13" y="63" width="10" height="10" fill="none" stroke="#3B82F6" stroke-width="2" rx="2"/>
    <text x="45" y="67" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#111827">PO-2025-0011</text>
    <text x="45" y="78" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6B7280">Materials Inspection</text>
    <text x="240" y="72" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#111827">$1,250</text>
    
    <!-- Item 3 -->
    <circle cx="18" cy="118" r="16" fill="#FEF3C7"/>
    <circle cx="18" cy="118" r="6" fill="#F59E0B"/>
    <text x="45" y="117" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#111827">PO-2025-0010</text>
    <text x="45" y="128" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6B7280">Waiting for Approval</text>
    <text x="240" y="122" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#111827">$3,420</text>
    
    <!-- Item 4 -->
    <circle cx="18" cy="168" r="16" fill="#D1FAE5"/>
    <path d="M14 168 L17 171 L22 166" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="45" y="167" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#111827">PO-2025-0009</text>
    <text x="45" y="178" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6B7280">Completed</text>
    <text x="240" y="172" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#10B981">$890</text>
  </g>
  
  <!-- Bottom section indicator -->
  <line x1="35" y1="280" x2="325" y2="280" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="375" y1="280" x2="665" y2="280" stroke="#E5E7EB" stroke-width="1"/>
</svg>

