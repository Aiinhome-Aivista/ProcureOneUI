<div *ngIf="isVisible" class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-gray-400 bg-opacity-50" (click)="close()"></div>

  <!-- Modal Container -->
  <div class="relative bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 p-6 sm:p-8">
    <!-- Close Button -->
    <button
      (click)="close()"
      class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition"
      aria-label="Close modal"
    >
      <span class="material-symbols-outlined text-2xl">close</span>
    </button>

    <!-- Content -->
    <div class="text-center">
      <!-- Icon -->
      <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-green-200">
        <span class="material-symbols-outlined text-4xl text-green-600">
          check_circle
        </span>
      </div>

      <!-- Title -->
      <h2 class="text-xl font-bold text-gray-800 mb-2">
        Finalize Your Bid Submission
      </h2>

     
    </div>
  </div>
</div>
