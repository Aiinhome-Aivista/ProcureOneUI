<!-- Global Loader Overlay -->
@if (loaderService.isLoading()) {
<div class="fixed inset-0 bg-black/50 z-9999 flex items-center justify-center">
  <div class="bg-white min-w-60 rounded-lg p-8 shadow-2xl flex flex-col items-center gap-4">
    <app-loader [size]="'lg'" [color]="'bg-primary-600'" [speed]="1"></app-loader>
    <p class="text-gray-700 font-medium text-lg">Loading...</p>
  </div>
</div>
}

<p-toast key="httpErrors" position="top-right" [baseZIndex]="11000" />
<router-outlet />
