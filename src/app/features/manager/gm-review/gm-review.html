<div class="bg-white p-4">
  <h2 class="text-base font-bold text-gray-900 mb-6">
    GM Review & Decision
  </h2>

  <form [formGroup]="reviewForm" class="space-y-6">
    <!-- GM Notes (Private) -->
    <div>
      <label for="gmNotes" class="block text-sm font-medium text-gray-700 mb-2">
        GM Notes (Private)<span class="text-red-500">*</span>
      </label>
      <textarea
        id="gmNotes"
        formControlName="gmNotes"
        rows="5"
        placeholder="Add your private notes here...."
        class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent resize-none"
      ></textarea>
    </div>

    <!-- Initial Assessment (Private) -->
    <div>
      <label for="initialAssessment" class="block text-sm font-medium text-gray-700 mb-2">
        Initial Assessment (Private)<span class="text-red-500">*</span>
      </label>
      <textarea
        id="initialAssessment"
        formControlName="initialAssessment"
        rows="6"
        placeholder="Summarize your findings.."
        class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent resize-none"
      ></textarea>
    </div>

    <!-- Review Segment (Upload Document) -->
    <div>
      <label for="reviewSegment" class="block text-sm font-medium text-gray-700 mb-2">
        Review Segment (Upload Document)
      </label>
      <div class="relative">
        <select
          id="reviewSegment"
          formControlName="reviewSegment"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm text-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent appearance-none cursor-pointer"
        >
          <option value="" disabled selected>Choose Document</option>
          <option value="financial">Financial Document</option>
          <option value="legal">Legal Document</option>
          <option value="compliance">Compliance Document</option>
          <option value="technical">Technical Document</option>
        </select>
        <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
          expand_more
        </span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="space-y-3 pt-4">
      <!-- Send for Resubmition -->
      <button
        type="button"
        (click)="sendForResubmition()"
        [disabled]="!reviewForm.valid || isSubmitting()"
        class="w-full py-3 px-4 bg-yellow-100 hover:bg-yellow-200 text-yellow-700 font-semibold rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Send for Resubmition
      </button>

      <!-- Reject and Approve Buttons -->
      <div class="grid grid-cols-2 gap-3">
        <button
          type="button"
          (click)="rejectApplication()"
          [disabled]="!reviewForm.valid || isSubmitting()"
          class="py-3 px-4 bg-red-50 hover:bg-red-100 text-red-600 font-semibold rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Reject Application
        </button>
        <button
          type="button"
          (click)="approveVendor()"
          [disabled]="!reviewForm.valid || isSubmitting()"
          class="py-3 px-4 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Approve Vendor
        </button>
      </div>
    </div>
  </form>
</div>
