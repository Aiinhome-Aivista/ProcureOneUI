<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 bg-[#F7F7F7] rounded-lg p-4">
  @for (card of statusCards(); track card.id) {
    <div [class]="'rounded-lg border border-gray-300 p-6 ' ">
      <div class="flex items-start gap-3">
        <span [class]="'material-symbols-outlined text-2xl ' + getIconClass(card.status)">
          {{ card.icon }}
        </span>
        <div class="flex-1">
          <h3 class="text-sm font-semibold text-gray-900 mb-2">
            {{ card.title }}
          </h3>
          <p class="text-xs text-gray-600 leading-relaxed">
            {{ card.description }}
          </p>
        </div>
      </div>
    </div>
  }
</div>
