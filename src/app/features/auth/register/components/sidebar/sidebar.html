<div class="w-full h-full p-4 pr-3 flex flex-col gap-8">
  <div class="header">
    <h1 class="text-xl font-semibold text-neutral-900 leading-tight">Become a Valued Vendor</h1>
    <p class="text-xs text-neutral-500 mt-1">Join our network of trusted suppliers.</p>
  </div>

  <div class="flex-1 flex">
    <!-- Left nav column -->
    <div class="w-full border-r border-neutral-200">
      <div class="flex flex-col gap-2">
        @for (item of navItems(); track $index; let i = $index) {
        <button
          type="button"
          
          class="group text-left relative pr-3 rounded-md transition-colors duration-200 ease-out"
        >
          <div
            class="p-3 rounded-md transition-all duration-200"
            [class.font-semibold]="currentStep() === item.stepNo"
            [class.bg-stepper-bg]="currentStep() === item.stepNo"
          >
            <h2 class="text-[12px] font-bold text-neutral-900 leading-5">
              {{ item.title }}
            </h2>
            <p class="text-[10px] font-normal text-neutral-500 leading-3 mt-1 hidden xl:block">
              {{ item.description }}
            
            </p>
          </div>

          <!-- Right border indicator -->
          <span
            class="absolute -right-1 top-0 h-full w-0 transition-all duration-200 ease-out rounded-r-md rounded-l-md"
            [class.w-2]="currentStep() === item.stepNo"
            [class.bg-primary-600]="currentStep() === item.stepNo"
          ></span>
        </button>
        }
      </div>
    </div>

    <!-- Right content placeholder (optional) -->
    <div class="flex-1"></div>
  </div>
</div>
