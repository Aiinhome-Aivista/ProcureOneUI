<div class="w-full h-full p-6 pr-3 flex flex-col gap-8">
  <div class="header">
    <h1 class="text-lg font-semibold leading-tight" style="color: var(--text-primary)">Become a Valued Vendor</h1>
    <p class="text-xs mt-1" style="color: var(--text-secondary)">Join our network of trusted suppliers.</p>
  </div>

  <div class="flex-1 flex">
    <!-- Left nav column -->
    <div class="w-full border-r" style="border-color: var(--border-light)">
      <div class="flex flex-col gap-2">
        @for (item of navItems(); track $index; let i = $index) {
        <button
          type="button"
          (click)="select(i)"
          class="group text-left relative pr-3 rounded-md transition-colors duration-200 ease-out"
        >
          <div
            class="p-2 rounded-md transition-all duration-200"
            [class.font-semibold]="currentStep() === item.stepNo"
            [style.background-color]="currentStep() === item.stepNo ? 'var(--primary-100)' : 'transparent'"
          >
            <h2 class="text-[11px] font-semibold leading-4" style="color: var(--text-primary)">
              {{ item.title }}
            </h2>
            <p class="text-[10px] leading-5 mt-1 hidden xl:block" style="color: var(--text-secondary)">
              {{ item.description }}
            
            </p>
          </div>

          <!-- Right border indicator -->
          <span
            class="absolute -right-1 top-0 h-full w-0 transition-all duration-200 ease-out rounded-r-md rounded-l-md"
            [class.w-2]="currentStep() === item.stepNo"
            [style.background-color]="currentStep() === item.stepNo ? 'var(--primary-600)' : 'transparent'"
          ></span>
        </button>
        }
      </div>
    </div>

    <!-- Right content placeholder (optional) -->
    <div class="flex-1"></div>
  </div>
</div>
