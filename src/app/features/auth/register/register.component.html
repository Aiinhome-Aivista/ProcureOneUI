<div class="h-screen flex flex-col" style="background-color: var(--bg-body)">
  <!-- Header -->
  <div class="border-b shrink-0" style="background-color: var(--bg-card); border-color: var(--border-light)">
    <div class="px-6 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <a routerLink="/login" class="flex items-center transition" style="color: var(--text-secondary)" 
             onmouseover="this.style.color='var(--text-primary)'" 
             onmouseout="this.style.color='var(--text-secondary)'">
            <span class="material-symbols-outlined">arrow_back</span>
          </a>
          <div>
            <img src="assets/icons/Aiinhome _ PO.svg" alt="Aiinhome PO Logo" />
          </div>
        </div>
        <div class="text-sm" style="color: var(--text-secondary)">
          <h3>28th October</h3>
          <small>12:15 PM</small>
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-4 flex-1 h-[calc(100vh-5rem)]">

    <div class="col-span-1 h-full">
      <app-sidebar [currentStep]="currentStep()" (stepChange)="onStepChange($event)" />
    </div>



    <div class="col-span-3 p-6 pl-3 overflow-y-auto h-full flex flex-col gap-2">
      <!-- Step Indicator (Static for UI only) -->
      <div class="">
        <app-step-indicator />
      </div>

      <!-- Main Content Area -->
      <div class="flex-1 overflow-y-auto">
        <!-- Step 1: Identity Details -->
        @if (currentStep() === 1) {
          <app-identity-details />
        }

        <!-- Step 2: Business Tax Registration -->
        @if (currentStep() === 2) {
          <app-business-tax-registration />
        }

        <!-- Step 3: Bank Identity Verification -->
        @if (currentStep() === 3) {
          <app-bank-identity-verification />
        }

        <!-- Step 4: Financial Documents -->
        @if (currentStep() === 4) {
          <!-- <app-financial-documents /> -->
           <app-final-submission />
          
        }
      </div>

      <div class="flex items-center justify-between border-t py-3" style="border-color: var(--border-light)">
        <button
          type="button"
          class="inline-flex items-center gap-2 rounded-full border px-5 py-2 text-sm font-medium transition focus-visible:outline-2 focus-visible:outline-offset-2 disabled:cursor-not-allowed"
          style="
            border-color: var(--border-light);
            color: var(--text-secondary);
            background-color: transparent;
          "
          onmouseover="if(!this.disabled) this.style.backgroundColor='var(--bg-hover)'"
          onmouseout="this.style.backgroundColor='transparent'"
          (click)="resetSteps()"
          [disabled]="isFirstStep()"
          [style.opacity]="isFirstStep() ? '0.5' : '1'"
        >
          <span class="material-symbols-outlined text-base">autorenew</span>
          Reset
        </button>

        <div class="flex items-center gap-3">
          <button
            type="button"
            class="inline-flex items-center gap-2 rounded-full border px-5 py-2 text-sm font-medium transition focus-visible:outline-2 focus-visible:outline-offset-2 disabled:cursor-not-allowed"
            style="
              border-color: var(--border-light);
              color: var(--text-secondary);
              background-color: transparent;
            "
            onmouseover="if(!this.disabled) this.style.backgroundColor='var(--bg-hover)'"
            onmouseout="this.style.backgroundColor='transparent'"
            (click)="previousStep()"
            [disabled]="isFirstStep()"
            [style.opacity]="isFirstStep() ? '0.5' : '1'"
          >
            Previous
          </button>

          <button
            type="button"
            class="inline-flex items-center gap-2 rounded-full px-6 py-2 text-sm font-semibold text-white transition focus-visible:outline-2 focus-visible:outline-offset-2 disabled:cursor-not-allowed"
            style="
              background-color: var(--primary-600);
            "
            onmouseover="if(!this.disabled) this.style.backgroundColor='var(--primary-500)'"
            onmouseout="if(!this.disabled) this.style.backgroundColor='var(--primary-600)'"
            (click)="nextStep()"
            [disabled]="isLastStep()"
            [style.opacity]="isLastStep() ? '0.5' : '1'"
          >
            Next
          </button>
        </div>
      </div>



    </div>
  </div>
</div>
