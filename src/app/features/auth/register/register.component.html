<div class="h-screen bg-gray-50 flex flex-col">
  <!-- Header -->
  <div class="bg-white border-b border-gray-200 shrink-0">
    <div class="px-6 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <a routerLink="/login" class="text-gray-600 hover:text-gray-900 flex items-center">
            <span class="material-symbols-outlined">arrow_back</span>
          </a>
          <div>
            <img src="assets/icons/Aiinhome _ PO.svg" alt="Aiinhome PO Logo" />
          </div>
        </div>
        <div class="text-sm text-gray-600">
          <h3>28th October</h3>
          <small>12:15 PM</small>
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-4 flex-1 h-[calc(100vh-4.8rem)]">
    <div class="col-span-1 h-full">
      <app-sidebar [currentStep]="currentStep()" />
    </div>
    <div class="col-span-3 px-6 py-8 overflow-y-auto h-full">
      <!-- Step Indicator -->
      <div class="mb-8 bg-white rounded-xl shadow-sm p-6">
        <app-step-indicator [currentStep]="currentStep()" />
      </div>

      <!-- Main Content Area -->
      <div class="">
        <!-- Step 1: Basic Information -->
        @if (currentStep() === 1) {
        <app-company-details [data]="registrationData().basicInfo" (dataChange)="updateStepData(1, $event)" />
        }

        <!-- Step 2: Financial Verification -->
        @if (currentStep() === 2) {
        <app-step2-financial-verification [data]="registrationData().financialVerification"
          (dataChange)="updateStepData(2, $event)" />
        }

        <!-- Step 3: Risk Factor -->
        @if (currentStep() === 3) {
        <app-step3-risk-factor [data]="registrationData().riskFactor" (dataChange)="updateStepData(3, $event)" />
        }

        <!-- Step 4: Capability -->
        @if (currentStep() === 4) {
        <app-step4-capability [data]="registrationData().capability" (dataChange)="updateStepData(4, $event)" />
        }

        <!-- Step 5: Approved (Review & Submit) -->
        @if (currentStep() === 5) {
        <app-step5-approved [data]="registrationData().approved"
          [termsAccepted]="registrationData().approved?.termsAccepted || false"
          (dataChange)="updateStepData(5, $event)" />
        }

        <!-- Navigation Buttons -->
        <div class="mt-8 pt-6">
          <div class="flex flex-col sm:flex-row sm:justify-between gap-4">
            <!-- (Reset) -->
            <div class="flex justify-start">
              @if (currentStep() === 1) {
              <button type="button" (click)="resetForm()"
                class="w-full sm:w-auto flex items-center justify-center sm:justify-start gap-2 px-6 py-2.5 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors cursor-pointer">
                <span class="material-symbols-outlined text-sm">refresh</span>
                <span>Reset</span>
              </button>
              }
            </div>

            <!-- (Prev + Next/Submit) -->
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 sm:gap-4 justify-end">
              <!-- Previous Button -->
              <button type="button" (click)="previousStep()" [disabled]="currentStep() === 1" class="w-full sm:w-auto flex items-center justify-center gap-2 px-6 py-2.5 border border-gray-300 rounded-lg text-gray-700
               hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                [ngClass]="{ 'cursor-pointer': currentStep() !== 1 }">
                <span class="material-symbols-outlined text-sm">arrow_back</span>
                <span>Previous</span>
              </button>

              <!-- Next / Submit Button -->
              @if (currentStep() < totalSteps) { <button type="button" (click)="nextStep()"
                [disabled]="!isCurrentStepValid()" class="w-full sm:w-auto flex items-center justify-center gap-2 px-6 py-2.5 rounded-lg transition-colors
               bg-primary-600 text-white hover:bg-primary-700 disabled:bg-gray-400 disabled:cursor-not-allowed"
                [ngClass]="{ 'cursor-pointer': isCurrentStepValid() }">
                <span>Next Step</span>
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
                </button>
                } @else {
                <button type="button" (click)="submitRegistration()" [disabled]="!isCurrentStepValid()"
                  class="w-full sm:w-auto flex items-center justify-center gap-2 px-6 py-2.5 bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors"
                  [ngClass]="{ 'cursor-pointer': isCurrentStepValid() }">
                  <span>Submit Registration</span>
                  <span class="material-symbols-outlined text-sm">send</span>
                </button>
                }
            </div>
          </div>
        </div>

      </div>

      <!-- Back to Login -->
      <!-- <div class="text-center mt-6">
        <a routerLink="/login" class="text-sm text-primary-600 hover:text-primary-700 font-medium">
          <span class="material-symbols-outlined text-sm align-middle">arrow_back</span>
          Already have an account? Login here
        </a>
      </div> -->
    </div>
  </div>
</div>
