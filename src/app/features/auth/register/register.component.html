<div class="h-screen bg-white flex flex-col">
  <!-- Header -->
  <div class="bg-white border-b border-gray-200 shrink-0">
    <div class="px-6 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <a routerLink="/login" class="text-gray-600 hover:text-gray-900 flex items-center">
            <span class="material-symbols-outlined">arrow_back</span>
          </a>
          <div>
            <img src="assets/icons/Aiinhome _ PO.svg" alt="Aiinhome PO Logo" />
          </div>
        </div>
        <div class="text-sm text-gray-600">
          <h3>28th October</h3>
          <small>12:15 PM</small>
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-4 flex-1 h-[calc(100vh-4.8rem)]">

    <div class="col-span-1 h-full">
      <app-sidebar [currentStep]="currentStep()" (stepChange)="onStepChange($event)" />
    </div>



    <div class="col-span-3 p-6 pl-3 overflow-y-auto h-full">
      <!-- Step Indicator (Static for UI only) -->
      <div class="mb-8">
        <app-step-indicator />
      </div>

      <!-- Main Content Area -->
      <div class="">
        <!-- Step 1: Identity Details -->
        @if (currentStep() === 1) {
          <app-identity-details />
        }

        <!-- Step 2: Business Tax Registration -->
        @if (currentStep() === 2) {
          <app-business-tax-registration />
        }

        <!-- Step 3: Bank Identity Verification -->
        @if (currentStep() === 3) {
          <app-bank-identity-verification />
        }

        <!-- Step 4: Financial Documents -->
        @if (currentStep() === 4) {
          <app-financial-documents />
        }
      </div>

      <div class="mt-10 flex items-center justify-between border-t border-gray-200 pt-6">
        <button
          type="button"
          class="inline-flex items-center gap-2 rounded-full border border-gray-300 px-5 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 disabled:cursor-not-allowed disabled:border-gray-200 disabled:bg-gray-100 disabled:text-gray-400"
          (click)="resetSteps()"
          [disabled]="isFirstStep()"
        >
          <span class="material-symbols-outlined text-base">autorenew</span>
          Reset
        </button>

        <div class="flex items-center gap-3">
          <button
            type="button"
            class="inline-flex items-center gap-2 rounded-full border border-gray-300 px-5 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 disabled:cursor-not-allowed disabled:border-gray-200 disabled:bg-gray-100 disabled:text-gray-400"
            (click)="previousStep()"
            [disabled]="isFirstStep()"
          >
            Previous
          </button>

          <button
            type="button"
            class="inline-flex items-center gap-2 rounded-full bg-indigo-600 px-6 py-2 text-sm font-semibold text-white transition hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 disabled:cursor-not-allowed disabled:bg-indigo-300"
            (click)="nextStep()"
            [disabled]="isLastStep()"
          >
            Next
          </button>
        </div>
      </div>



    </div>
  </div>
</div>
