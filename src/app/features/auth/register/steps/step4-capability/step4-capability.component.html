<div class="space-y-6">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-900">Capability Assessment</h2>
        <p class="text-sm text-gray-600 mt-1">Demonstrate your business capabilities</p>
    </div>

    <div class="bg-blue-50 border border-blue-200 rounded-lg p-6">
        <div class="flex items-start gap-3">
            <span class="material-icons text-blue-600">info</span>
            <div>
                <h3 class="font-semibold text-blue-900 mb-2">Capability Evaluation</h3>
                <p class="text-sm text-blue-800">
                    This section will assess your technical capabilities, production capacity,
                    quality certifications, and past performance records.
                </p>
            </div>
        </div>
    </div>

    <!-- Placeholder for capability form -->
    <div class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
                Production Capacity (units/month)
            </label>
            <input type="number"
                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500"
                placeholder="Enter production capacity" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
                Quality Certifications
            </label>
            <input type="text"
                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500"
                placeholder="e.g., ISO 9001, ISO 14001" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
                Years of Experience
            </label>
            <input type="number"
                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500"
                placeholder="Enter years" />
        </div>
    </div>
</div>
