<div class="max-w-6xl mx-auto p-1 bg-white rounded-lg shadow" aria-label="Company Details Form">
  <!-- Tabs -->
  <nav class="flex border-b mb-6" role="tablist">
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="activeTab() === 'identity'"
      class="px-4 py-2 -mb-px font-medium border-b focus:outline-none"
      [class.border-indigo-600]="activeTab() === 'identity'"
      [class.text-indigo-700]="activeTab() === 'identity'"
      [class.text-gray-600]="activeTab() !== 'identity'"
      [class.hover\:text-indigo-600]="activeTab() !== 'identity'"
      (click)="switchTab('identity')"
    >
      Company Identity Details
    </button>
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="activeTab() === 'addresses'"
      class="px-4 py-2 font-medium border-b-2 focus:outline-none"
      [class.border-indigo-600]="activeTab() === 'addresses'"
      [class.text-indigo-700]="activeTab() === 'addresses'"
      [class.text-gray-600]="activeTab() !== 'addresses'"
      [class.hover\:text-indigo-600]="activeTab() !== 'addresses'"
      (click)="switchTab('addresses')"
    >
      Registered & Operational Addresses
    </button>
  </nav>

  <!-- Identity Details Tab -->
  <section *ngIf="activeTab() === 'identity'">
    <form [formGroup]="identityForm" class="space-y-7" autocomplete="off">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Company Name (Legal)*</label>
          <input formControlName="companyName"
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:border-indigo-500" placeholder="e.g., ABC Infrastructure Pvt. Ltd." />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Registration Number*</label>
          <input formControlName="registrationNumber"
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:border-indigo-500" placeholder="e.g., CIN: U12345WB2015PTC123456" />
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Business Type*</label>
          <select formControlName="businessType"
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:border-indigo-500">
            <option>Select Type</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Industry Category*</label>
          <select formControlName="industryCategory"
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:border-indigo-500">
            <option>Select Type</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Date of Incorporation*</label>
          <input formControlName="dateOfIncorporation" type="date"
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:border-indigo-500" />
        </div>
        <div></div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nature of Business*</label>
        <textarea rows="3" formControlName="natureOfBusiness"
          class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:border-indigo-500"
          placeholder='Short description (e.g., "Supplier of construction materials")'></textarea>
      </div>
 
    </form>
  </section>

  <!-- Registered & Operational Addresses Tab -->
  <section *ngIf="activeTab() === 'addresses'">
    <form [formGroup]="addressForm" class="space-y-7" autocomplete="off">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Registered Address*</label>
          <input formControlName="registeredAddress"
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:border-indigo-500"
            placeholder="Legal office as per incorporation certificate" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Operational Address*</label>
          <input formControlName="operationalAddress"
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:border-indigo-500"
            placeholder="Where operations or supply chain is managed" />
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Country*</label>
          <select formControlName="country"
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:border-indigo-500">
            <option>Select Country</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">State*</label>
          <select formControlName="state"
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:border-indigo-500">
            <option>Select State</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">City*</label>
          <select formControlName="city"
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:border-indigo-500">
            <option>Select City</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">PIN*</label>
          <input formControlName="pin"
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:border-indigo-500"
            placeholder="Enter Your PIN" />
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contact Person (Authorized Representative)*</label>
          <input formControlName="contactPerson"
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:border-indigo-500"
            placeholder="e.g., Mr. Rajesh Singh" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Designation / Role*</label>
          <select formControlName="designation"
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:border-indigo-500">
            <option>e.g., Director / Procurement Head</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email Address (Official)*</label>
          <input formControlName="email" type="email"
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:border-indigo-500"
            placeholder="e.g., rajesh@abcinfra.com" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number (Official)*</label>
          <input formControlName="phone" type="tel"
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:border-indigo-500"
            placeholder="e.g., +91 9876543210" />
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Alternate Contact (Optional)</label>
        <input formControlName="alternateContact"
          class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:border-indigo-500"
          placeholder="Backup contact for emergencies" />
      </div>
    
    </form>
  </section>
</div>
