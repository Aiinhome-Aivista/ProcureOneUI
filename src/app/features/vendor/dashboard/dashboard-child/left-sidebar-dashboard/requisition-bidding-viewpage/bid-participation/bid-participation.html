<div class="bg-neutral-100 rounded-2xl p-5">
    <h3 class="text-xl font-semibold text-black">
        Bid Participation
    </h3>

    <form #bidForm="ngForm" class="space-y-4">
        <!-- Bid Amount -->
        <div>
            <label class="text-xs text-gray-600 font-bold">Your Bid Amount ($) <span
                    class="text-red-700">*</span></label>
            <input type="number" name="bidAmount" [ngModel]="bidAmount()" (ngModelChange)="bidAmount.set($event)"
                placeholder="e.g., 245000" required
                class="mt-1 w-full border rounded-lg px-3 py-2 text-sm  text-primary-600 focus:ring-2 focus:ring-primary-500 focus:outline-none" />
        </div>

        <!-- Delivery Time -->
        <div>
            <label class="text-xs text-gray-600 font-bold">Proposed Delivery Time (Days)
                <span class="text-red-700">*</span></label>
            <input type="number" name="deliveryTime" [ngModel]="deliveryTime()" (ngModelChange)="deliveryTime.set($event)"
                placeholder="e.g., 85" required
                class="mt-1 w-full border rounded-lg px-3 py-2 text-sm text-primary-600 focus:ring-2 focus:ring-primary-500 focus:outline-none" />
        </div>

        <!-- Upload Section -->
        <div>
            <label class="text-xs text-gray-600 font-bold">Upload Quote & Documents <span
                    class="text-red-700">*</span></label>
            <input type="file" #fileInput class="hidden" (change)="onFileSelected($event)" accept=".pdf" />

            <div (click)="fileInput.click()" (dragover)="$event.preventDefault(); isDragging.set(true)"
                (dragleave)="$event.preventDefault(); isDragging.set(false)"
                (drop)="$event.preventDefault(); isDragging.set(false); onFileSelected($event)" [class]="'mt-2 border-2 border-dashed border-gray-300 text-center rounded-xl text-xs text-gray-500 hover:border-primary-500 transition cursor-pointer flex flex-col justify-center items-center '
                     + (isDragging() ? 'border-primary-500 bg-primary-50 ' : '')
                     + (!selectedFile() ? 'h-40 p-6' : '')">

                @if (!selectedFile()) {
                <div class="flex flex-col items-center">
                    <span class="material-symbols-outlined text-zinc-300 text-4xl">cloud_upload</span>
                    <p class="text-[#7C6FA2] mt-2">
                        <span class="font-semibold">Click to upload</span> or drag and drop<br />
                        <span>PDF (MAX 5MB)</span>
                    </p>
                </div>
                } @else {
                <div class="w-full text-left p-3">
                    <div class="flex items-center justify-between bg-gray-100 p-3 rounded-lg">
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="material-symbols-outlined text-green-600">description</span>
                            <div class="flex-1 min-w-0">
                                <p class="text-xs font-semibold text-gray-800 truncate" [title]="selectedFile()?.name">
                                    {{ selectedFile()?.name }}</p>
                                <p class="text-xs text-gray-500">{{ (selectedFile()!.size / 1024).toFixed(2) }} KB</p>
                            </div>
                        </div>
                        <button (click)="$event.stopPropagation(); removeFile()"
                            class="text-red-500 hover:text-red-700">
                            <span class="material-symbols-outlined">delete</span>
                        </button>
                    </div>
                </div>
                }
            </div>
        </div>

        <!-- Checkbox -->
        <div class="flex items-start gap-2 text-xs text-gray-600">
            <input type="checkbox" name="agreeToTerms" [ngModel]="agreeToTerms()" (ngModelChange)="agreeToTerms.set($event)"
                required class="mt-1 rounded border-gray-300 text-primary-600 focus:ring-primary-500" />
            <label>I declare that all information provided is accurate and I agree to
                the terms and conditions.</label>
        </div>

        <!-- Button -->
        <button type="button" (click)="isModalVisible.set(true)" [disabled]="!isFormValid()"
            [class]="'w-full py-2.5 rounded-xl text-base transition ' + (isFormValid() ? 'bg-primary-600 text-white hover:bg-primary-700 cursor-pointer' : 'bg-gray-200 text-gray-400 cursor-not-allowed')">
            Submit Bid
        </button>
    </form>
</div>

<!-- Bid Submission Modal -->
<app-bid-submission-modal [isVisible]="isModalVisible()" requisitionId="All-REQ-015-2025"
    (onCancel)="isModalVisible.set(false)" (onConfirm)="handleBidSubmission()">
</app-bid-submission-modal>
