<div class="bg-stepper-bg rounded-2xl p-6 sm:p-4 flex flex-col">
  <!-- Header -->
  <div class="w-full mb-2">
    <p class="text-sm font-semibold text-black">Bid Request Vs Approved</p>
  </div>

  <!-- Stats -->
  <div class="flex items-baseline justify-start">
    <span class="text-2xl sm:text-2xl text-black font-extralight">{{approvedBids()}}</span>
    <span class="text-xs text-black ml-1 font-extralight">/ {{totalBids()}}</span>
  </div>

  <!-- Donut Chart -->
  <div class="relative w-36 h-36 sm:w-44 sm:h-44 mb-3 self-center">
    <canvas #donutChart class="w-full h-full items-center justify-center"></canvas>
  </div>

  <!-- Legend -->
  <div class="flex gap-4 text-xs sm:text-sm text-[#000000CC]">
    <div class="flex items-center gap-1.5">
      <span class="w-5 h-5 rounded-full bg-[#D9D9D9]" aria-hidden="true"></span>
      <span class="text-[#0000008F] text-xs">Requested Bid</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="w-5 h-5 rounded-full bg-primary-600" aria-hidden="true"></span>
      <span class="text-[#0000008F] text-xs">Approved Bid</span>
    </div>
  </div>
</div>
