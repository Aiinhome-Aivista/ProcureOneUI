<div
  class="bg-[#F5F5F5] rounded-2xl p-4 sm:p-4 sm:mt-7 flex flex-col items-center justify-start"
  role="region"
  aria-label="Bid Request vs Approved chart"
>
  <!-- Header -->
  <h2 class="text-sm sm:text-base font-bold text-[#000000CC] mb-2">Bid Request Vs Approved</h2>

  <!-- Stats -->
  <div class="flex items-baseline justify-center mb-2">
    <span class="text-2xl sm:text-3xl font-semibold text-black">{{ approvedBids() }}</span>
    <span class="text-sm text-[#00000080] ml-1">/ {{ totalBids() }}</span>
  </div>

  <!-- Donut Chart -->
  <div class="relative w-36 h-36 sm:w-44 sm:h-44 mb-3">
    <canvas #donutChart class="w-full h-full" aria-hidden="true"></canvas>
  </div>

  <!-- Legend -->
  <div class="flex items-center justify-center gap-4 text-xs sm:text-sm text-[#000000CC]">
    <div class="flex items-center gap-1.5">
      <span class="w-3 h-3 rounded-full bg-[#D9D9D9]" aria-hidden="true"></span>
      <span>Requested Bid</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="w-3 h-3 rounded-full bg-[#4319C2]" aria-hidden="true"></span>
      <span>Approved Bid</span>
    </div>
  </div>
</div>
