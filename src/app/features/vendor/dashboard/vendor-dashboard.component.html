<div class="grid grid-cols-12 gap-6">
  <!-- Left Sidebar -->
  <div class="col-span-3 space-y-4">
    <app-left-sidebar></app-left-sidebar>
  </div>

  <!-- Right Main Section -->
  <div class="col-span-9 space-y-4">
    <!-- Top Cards -->
    <app-top-card></app-top-card>

    <!-- Bidding Performance graph -->
    <app-biding-performance-graph></app-biding-performance-graph>

    <!-- Bottom Row -->
    <div class="grid grid-cols-3 gap-4">
      <!-- Bidding Status -->
      <div>
        <app-biding-status></app-biding-status>
      </div>

      <!-- Bidding History-->
      <div class="col-span-2">
        <app-biding-history></app-biding-history>
      </div>
    </div>
  </div>
</div>
