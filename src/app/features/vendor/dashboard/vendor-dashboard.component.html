<div class="grid grid-cols-4 gap-4 pl-2">
  <!-- Left Sidebar -->
  <div class="col-span-1 space-y-4">
    <app-left-sidebar></app-left-sidebar>
  </div>

  <!-- Right Main Section -->

  @if(isRequestionVisible) {

  <div class="col-span-3 flex flex-col gap-4">
    <app-it-equipment></app-it-equipment>

    <div class="grid md:grid-cols-3 gap-4">
      <div class="col-span-2">
        <app-requisition-details></app-requisition-details>
      </div>
      <div class="col-span-1">
        <app-bid-status></app-bid-status>
      </div>
    </div>
  </div>
  } @else {
  <div class="col-span-3 flex flex-col gap-4">
    <!-- Top Cards -->
    <app-top-card [userType]="'vendor'"></app-top-card>

    <!-- Bidding Performance graph -->
    <app-biding-performance-graph></app-biding-performance-graph>

    <!-- Bottom Row -->
    <div class="grid md:grid-cols-3 gap-4">
      <!-- Bidding Status -->
      <div>
        <app-biding-status></app-biding-status>
      </div>

      <!-- Bidding History-->
      <div class="col-span-2">
        <app-biding-history></app-biding-history>
      </div>
    </div>
  </div>

  }
</div>
