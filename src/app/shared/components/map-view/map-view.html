<!-- Google Maps Container -->
<div class="w-full rounded-xl overflow-hidden shadow-xl border border-slate-200 bg-white h-full">
  <!-- Map Section -->
  <div class="relative h-full">
    <google-map
      [options]="mapOptions()"
      [center]="center()"
      [zoom]="zoom()"
      class="w-full h-full"
      role="region"
      aria-label="Interactive map showing Victoria Memorial in Kolkata"
    >
      <map-marker
        [position]="markerPosition()"
        [options]="markerOptions()"
        aria-label="Marker for Victoria Memorial, Kolkata"
      />
    </google-map>
