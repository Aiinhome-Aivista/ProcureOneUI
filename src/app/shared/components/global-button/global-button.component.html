<button
  [type]="type"
  [disabled]="disabled || loading"
  class="global-btn flex items-center justify-center transition-all duration-300"
  [ngClass]="[
    variant === 'filled' ? 'btn-filled' : 'btn-outlined',
    disabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer',
    customClass
  ]"
  (click)="handleClick($event)"
>
  <span
    *ngIf="loading"
    class="material-symbols-outlined animate-spin mr-2 text-sm"
  >
    progress_activity
  </span>

  <span
    *ngIf="!loading && icon && iconPos === 'left'"
    class="material-symbols-outlined mr-2 text-lg"
  >
    {{ icon }}
  </span>

  <ng-content></ng-content>

  <span
    *ngIf="!loading && icon && iconPos === 'right'"
    class="material-symbols-outlined ml-2 text-lg"
  >
    {{ icon }}
  </span>
</button>
