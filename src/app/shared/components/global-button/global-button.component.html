<button
  [type]="type"
  [disabled]="disabled || loading"
  [ngClass]="[
    'rounded-[10px] px-4 py-2 gap-3.5 font-semibold text-sm min-w-[100px] flex items-center justify-center transition-all duration-300',
    variant === 'filled' ? 'bg-[#D9D9D9] text-black border-0 hover:bg-[#bfbfbf] disabled:hover:bg-[#D9D9D9]' : '',
    variant === 'outlined' ? 'bg-transparent border border-black text-black hover:bg-black/5 disabled:hover:bg-transparent' : '',
    disabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer',
    customClass,
 
  ]"
  (click)="handleClick($event)"
>
  <span *ngIf="loading" class="material-symbols-outlined animate-spin mr-2 text-sm">
    progress_activity
  </span>

  <span
    *ngIf="!loading && icon && iconPos === 'left'"
    class="material-symbols-outlined mr-2 text-lg"
  >
    {{ icon }}
  </span>

  <ng-content></ng-content>

  <span
    *ngIf="!loading && icon && iconPos === 'right'"
    class="material-symbols-outlined ml-2 text-lg"
  >
    {{ icon }}
  </span>
</button>
