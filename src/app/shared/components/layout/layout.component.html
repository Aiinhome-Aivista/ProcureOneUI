  <!-- Main Content -->
  <div class="flex-1 flex flex-col">
    <!-- Header -->
    <header class="bg-white shadow-sm h-16 flex items-center justify-between px-6">
      <button (click)="toggleSidebar()" class="p-2 rounded-lg hover:bg-gray-100 transition-colors">
        <span class="material-symbols-outlined">menu</span>
      </button>

      <div class="flex items-center gap-4">
        <!-- Role Badge -->
        <span [class]="'px-3 py-1 rounded-full text-xs font-semibold ' + getRoleBadgeClass()">
          {{ userRole()?.toUpperCase() }}
        </span>

        <!-- Notifications -->
        <button class="p-2 rounded-lg hover:bg-gray-100 relative">
          <span class="material-symbols-outlined">notifications</span>
          <span class="absolute top-1 right-1 h-2 w-2 bg-red-500 rounded-full"></span>
        </button>

        <!-- User Menu -->
        <div class="relative">
          <button
            (click)="toggleUserMenu()"
            class="flex items-center gap-2 p-2 rounded-lg hover:bg-gray-100"
          >
            <div
              class="h-8 w-8 rounded-full bg-primary-600 text-white flex items-center justify-center text-sm font-semibold"
            >
              {{ userInitials() }}
            </div>
            <span class="material-symbols-outlined text-sm">expand_more</span>
          </button>

          @if (showUserMenu()) {
          <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-1 z-50">
            <a
              [routerLink]="'/' + userRole() + '/profile'"
              class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
            >
              <span class="material-symbols-outlined text-sm mr-2">person</span>
              Profile
            </a>
            <a
              [routerLink]="'/' + userRole() + '/settings'"
              class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
            >
              <span class="material-symbols-outlined text-sm mr-2">settings</span>
              Settings
            </a>
            <hr class="my-1" />
            <button
              (click)="logout()"
              class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50"
            >
              <span class="material-symbols-outlined text-sm mr-2">logout</span>
              Logout
            </button>
          </div>
          }
        </div>
      </div>
    </header>

    <!-- Floating Sidebar (Right Side) -->
    <div class="fixed top-1/2 right-0 transform -translate-y-1/2 flex z-50 h-full items-center">
      <!-- Compact Vertical Icon Bar -->
      <div
        class="flex flex-col bg-white rounded-3xl shadow-lg p-2 space-y-3 transition-all duration-300"
      >
        <button
          (click)="toggleSidebarSecondary()"
          class="w-10 h-10 flex items-center justify-center rounded-full text-primary-600 hover:bg-primary-50"
        >
        @if(isExpanded) { <span class="material-symbols-outlined text-lg">chevron_right</span>}
        @else {<span class="material-symbols-outlined text-lg">chevron_left</span>}
          
        </button>
        <button
          class="w-10 h-10 flex items-center justify-center rounded-full text-primary-500 hover:bg-primary-100"
          [ngClass]="{ 'bg-primary-100 text-primary-700': activeMenu === 'dashboard' }"
          (click)="setActive('dashboard')"
        >
          <span class="material-symbols-outlined text-lg">dashboard</span>
        </button>
        <button
          class="w-10 h-10 flex items-center justify-center rounded-full text-primary-500 hover:bg-primary-100"
          [ngClass]="{ 'bg-primary-100 text-primary-700': activeMenu === 'bidding' }"
          (click)="setActive('bidding')"
        >
          <span class="material-symbols-outlined text-lg">gavel</span>
        </button>
        <button
          class="w-10 h-10 flex items-center justify-center rounded-full text-primary-500 hover:bg-primary-100"
          [ngClass]="{ 'bg-primary-100 text-primary-700': activeMenu === 'support' }"
          (click)="setActive('support')"
        >
          <span class="material-symbols-outlined text-lg">lightbulb</span>
        </button>
        <button
          class="w-10 h-10 flex items-center justify-center rounded-full text-primary-500 hover:bg-primary-100"
          [ngClass]="{ 'bg-primary-100 text-primary-700': activeMenu === 'settings' }"
          (click)="setActive('settings')"
        >
          <span class="material-symbols-outlined text-lg">settings</span>
        </button>
      </div>

      <!-- Expanded Sidebar Menu Panel -->
      @if (isExpanded) {
      <div
        class="bg-white shadow-2xl rounded-3xl p-6 w-70 h-full animate-slideIn border border-gray-100 flex flex-col justify-between"
      >
        <div>
          <!-- User Header -->
          <div class="flex items-center mb-6">
            <div
              class="w-10 h-10 rounded-full bg-primary-600 text-white flex items-center justify-center text-sm font-semibold"
            >
              {{ userInitials() }}
            </div>
            <div class="ml-3">
              <p class="font-semibold text-gray-800 text-sm">{{ currentUser()?.name }}</p>
              <p class="text-xs text-gray-500 capitalize">{{ userRole() }}</p>
            </div>
          </div>

          <!-- Menu Grid - 3x3 Layout -->
          <div class="grid grid-cols-2 gap-3 mb-3">
            <!-- Dashboard - Purple Background -->
            <button
              class="flex flex-col items-center justify-center bg-primary-100 hover:bg-primary-200 text-gray-700 rounded-2xl py-4 px-2 transition-all"
              (click)="setActive('dashboard')"
            >
              <span class="material-symbols-outlined text-primary-600 text-2xl mb-1"
                >dashboard</span
              >
              <span class="text-[10px] font-medium text-gray-700">Dashboard</span>
            </button>

            <!-- Profile -->
            <button
              class="flex flex-col items-center justify-center bg-gray-50 hover:bg-gray-100 text-gray-700 rounded-2xl py-4 px-2 transition-all"
              (click)="setActive('profile')"
            >
              <span class="material-symbols-outlined text-gray-600 text-2xl mb-1">person</span>
              <span class="text-[10px] font-medium text-gray-700">Profile</span>
            </button>

            <!-- Report It -->
            <button
              class="flex flex-col items-center justify-center bg-gray-50 hover:bg-gray-100 text-gray-700 rounded-2xl py-4 px-2 transition-all"
              (click)="setActive('reports')"
            >
              <span class="material-symbols-outlined text-gray-600 text-2xl mb-1">description</span>
              <span class="text-[10px] font-medium text-gray-700">Report It</span>
            </button>

            <!-- Support -->
            <button
              class="flex flex-col items-center justify-center bg-gray-50 hover:bg-gray-100 text-gray-700 rounded-2xl py-4 px-2 transition-all"
              (click)="setActive('support')"
            >
              <span class="material-symbols-outlined text-gray-600 text-2xl mb-1"
                >support_agent</span
              >
              <span class="text-[10px] font-medium text-gray-700">Support</span>
            </button>

            <!-- Bidding - With Border -->
            <button
              class="flex flex-col items-center justify-center bg-white hover:bg-gray-50 text-gray-700 rounded-2xl py-4 px-2 transition-all border border-gray-300"
              (click)="setActive('bidding')"
            >
              <span class="material-symbols-outlined text-gray-600 text-2xl mb-1">gavel</span>
              <span class="text-[10px] font-medium text-gray-700">Bidding</span>
            </button>

            <!-- Connect -->
            <button
              class="flex flex-col items-center justify-center bg-gray-50 hover:bg-gray-100 text-gray-700 rounded-2xl py-4 px-2 transition-all"
              (click)="setActive('connect')"
            >
              <span class="material-symbols-outlined text-gray-600 text-2xl mb-1">share</span>
              <span class="text-[10px] font-medium text-gray-700">Connect</span>
            </button>

            <!-- Settings -->
            <button
              class="flex flex-col items-center justify-center bg-gray-50 hover:bg-gray-100 text-gray-700 rounded-2xl py-4 px-2 transition-all"
              (click)="setActive('settings')"
            >
              <span class="material-symbols-outlined text-gray-600 text-2xl mb-1">settings</span>
              <span class="text-[10px] font-medium text-gray-700">Settings</span>
            </button>

            <!-- Registration -->
            <button
              class="flex flex-col items-center justify-center bg-gray-50 hover:bg-gray-100 text-gray-700 rounded-2xl py-4 px-2 transition-all"
              (click)="setActive('registration')"
            >
              <span class="material-symbols-outlined text-gray-600 text-2xl mb-1">lock</span>
              <span class="text-[10px] font-medium text-gray-700">Registration</span>
            </button>
          </div>
        </div>

        <!-- Bottom Navigation Icons -->
        <div class="flex items-center justify-center gap-8 pt-4 border-t border-gray-200">
          <button class="text-gray-400 hover:text-gray-600 transition-colors">
            <span class="material-symbols-outlined text-xl">arrow_back</span>
          </button>
          <button class="text-gray-400 hover:text-gray-600 transition-colors">
            <span class="material-symbols-outlined text-xl">info</span>
          </button>
        </div>
      </div>
      }
    </div>

    <!-- Page Content -->
    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
